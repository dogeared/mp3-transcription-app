version: '3.8'

services:
  mp3-transcriber:
    container_name: mp3-transcriber-app
    image: mp3-transcriber
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      # Spring Profile
      - SPRING_PROFILES_ACTIVE=docker
      # OAuth2 Configuration (REQUIRED - set these in .env file or environment)
      - OKTA_OAUTH2_CLIENT_ID=${OKTA_OAUTH2_CLIENT_ID}
      - OKTA_OAUTH2_ISSUER=${OKTA_OAUTH2_ISSUER}
      # AssemblyAI API Key (REQUIRED - set this in .env file or environment)
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY}
      # JVM Options
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    volumes:
      # Mount a volume for temporary file uploads
      - ./uploads:/tmp/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s 
