name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and coverage
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.results.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Test failures don't stop the build, so the JaCoCo report and badges are still produced;
      # the job is failed at the end instead
      - name: Run tests with coverage
        id: build
        continue-on-error: true
        run: ./mvnw -B test -Dmaven.test.failure.ignore=true

      - name: Summarize results and build badges
        id: results
        run: python3 .github/scripts/badges.py badges

      - name: Upload badges
        uses: actions/upload-artifact@v7
        with:
          name: badges
          path: badges/

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

      - name: Fail if the build or tests failed
        if: steps.build.outcome == 'failure' || steps.results.outputs.tests_failed == 'true'
        run: |
          echo "::error::Build or tests failed"
          exit 1

  # Badge JSON lives on the `badges` branch so badge updates never add commits to main.
  # Runs after failures too, so the tests badge shows them.
  publish-badges:
    name: Publish badges
    needs: test
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-badges
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: badges
          path: new-badges

      - name: Push to the badges branch
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads "$REPO_URL" badges >/dev/null; then
            git clone --quiet --depth 1 --branch badges "$REPO_URL" badges
          else
            git init --quiet -b badges badges
            git -C badges remote add origin "$REPO_URL"
          fi
          cp new-badges/*.json badges/
          cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Badges unchanged"
          else
            git commit --quiet -m "Update badges for ${GITHUB_SHA::7}"
            git push --quiet origin badges
          fi

  # Keeps git tags in step with the pom: the first green build of a new version tags it
  tag-version:
    name: Tag version
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create tag for the pom version if missing
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists"
          else
            git tag "$VERSION"
            git push origin "refs/tags/$VERSION"
            echo "Created tag $VERSION" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Publishes the NAS's copy of this app. The Synology pulls `:latest` on a timer;
  # `:sha-<short>` and the version tag are there for pinning a rollback.
  publish:
    name: Publish image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The Dockerfile copies a prebuilt target/*.jar, so build it here.
      - name: Build jar
        run: ./mvnw -B -DskipTests package

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dogeared/mp3-transcriber
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
            type=raw,value=${{ needs.test.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The timer is a backstop; this is the Render-like path. The agent is reachable
  # only through the NAS's Cloudflare tunnel and authorises each call with an
  # HMAC over "<timestamp>.<body>". If the secrets are not set, skip: the timer
  # will pick the image up on its next pass.
  deploy:
    name: Deploy to NAS
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Ask the NAS to deploy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          PROJECT: mp3-transcriber
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ] || [ -z "$DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::notice::deploy webhook not configured; the NAS timer will pick this up"
            exit 0
          fi
          BODY=$(printf '{"project":"%s","sha":"%s"}' "$PROJECT" "$GITHUB_SHA")
          TS=$(date +%s)
          SIG=$(python3 -c 'import hashlib,hmac,sys; print(hmac.new(sys.argv[1].encode(), sys.argv[2].encode()+b"."+sys.argv[3].encode(), hashlib.sha256).hexdigest())' "$DEPLOY_WEBHOOK_SECRET" "$TS" "$BODY")
          for attempt in 1 2 3; do
            code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "$DEPLOY_WEBHOOK_URL" \
              -H 'Content-Type: application/json' \
              -H "X-Deploy-Timestamp: $TS" \
              -H "X-Deploy-Signature: sha256=$SIG" \
              --data "$BODY" || echo 000)
            if [ "$code" = "200" ]; then
              cat /tmp/deploy.json
              exit 0
            fi
            echo "attempt $attempt failed (HTTP $code)"
            cat /tmp/deploy.json 2>/dev/null || true
            sleep 10
          done
          exit 1
