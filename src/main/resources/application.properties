# Server configuration
server.port=8080
server.forward-headers-strategy=framework
# Track sessions only with cookies, so session ids never appear in URLs (;jsessionid=...)
server.servlet.session.tracking-modes=cookie

# Tomcat settings for large file uploads
server.tomcat.connection-timeout=600000
server.tomcat.keep-alive-timeout=600000
server.tomcat.max-swallow-size=-1

# Spring multipart file upload settings
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.file-size-threshold=0

# Vaadin push settings for stable WebSocket connections during uploads
vaadin.heartbeatInterval=60
vaadin.closeIdleSessions=false

# Chunked upload settings
upload.temp.directory=${java.io.tmpdir}/mp3-transcriber-uploads
upload.chunk.size=52428800
upload.session.timeout=3600000
# Production mode settings
vaadin.productionMode=true
vaadin.frontend.hotdeploy=false

# Keycloak OIDC login (values come from the environment / .env)
# Public client: authorization code flow + PKCE (S256), no client secret
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-authentication-method=none
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=preferred_username
